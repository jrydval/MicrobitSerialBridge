services:
  microbit-webhook-bridge:
    build: .
    image: microbit-webhook-bridge
    container_name: microbit-webhook-bridge
    restart: unless-stopped
    devices:
      - "${SERIAL_PORT:-/dev/ttyACM0}:${SERIAL_PORT:-/dev/ttyACM0}"
    ports:
      - "${LISTEN_PORT:-8081}:8081"
    environment:
      - MICROBIT_WEBHOOK_URL=${MICROBIT_WEBHOOK_URL:-}
    command:
      - "-port=${SERIAL_PORT:-/dev/ttyACM0}"
      - "-baud=${BAUD_RATE:-115200}"
      - "-listen-addr=:8081"
